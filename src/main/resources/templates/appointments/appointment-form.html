<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment | Hospital Management System</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #102a43;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-card {
            width: 100%;
            max-width: 840px;
            background: #ffffff;
            border-radius: 16px;
            padding: 42px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .form-title {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 28px;
            color: #102a43;
        }

        .form-label {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border: 1px solid #d6dee8;
            border-radius: 8px;
            font-size: 17px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15);
        }

        .readonly-field {
            background: #f7f9fc;
            color: #334e68;
            cursor: not-allowed;
        }

        .info-label {
            font-size: 14px;
            color: #627d98;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 17px;
            font-weight: 600;
            color: #102a43;
        }

        .info-box {
            background: #f7f9fc;
            border: 1px solid #d6dee8;
            border-radius: 8px;
            min-height: 48px;
            padding: 12px 14px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .btn-update {
            min-height: 46px;
            padding: 0 18px;
            background: #1677ff;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 17px;
            font-weight: 600;
        }

        .btn-update:hover {
            background: #0969da;
        }

        .btn-cancel {
            min-height: 46px;
            padding: 0 18px;
            background: #6c757d;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 17px;
            font-weight: 600;
        }

        .btn-cancel:hover {
            background: #5c636a;
        }

        #errorMessage {
            display: none;
            margin-bottom: 24px;
        }

        #successMessage {
            display: none;
            margin-bottom: 24px;
        }

        .loading-text {
            color: #627d98;
        }

        @media (max-width: 700px) {

            .form-card {
                padding: 25px;
            }

            .form-title {
                font-size: 30px;
            }

            .button-row {
                flex-direction: column;
            }

            .btn-update,
            .btn-cancel {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="page-wrapper">

    <div class="form-card">

        <h1 class="form-title" id="formTitle">
            Appointment
        </h1>

        <!-- ERROR -->
        <div id="errorMessage"
             class="alert alert-danger">
        </div>

        <!-- SUCCESS -->
        <div id="successMessage"
             class="alert alert-success">
        </div>

        <form id="appointmentForm">

            <!-- =====================================================
                 PATIENT
                 READ ONLY
                 ===================================================== -->

            <div class="mb-4" id="patientInfoGroup">

                <label class="form-label">Patient</label>

                <div class="info-box">
                    <div id="patientDisplay" class="info-value loading-text">Loading...</div>
                </div>

            </div>

            <div class="mb-4" id="patientSelectGroup" style="display:none;">
                <label for="patientSelect" class="form-label">Patient <span class="text-danger">*</span></label>
                <select id="patientSelect" class="form-select" required></select>
            </div>


            <!-- =====================================================
                 DOCTOR
                 READ ONLY
                 ===================================================== -->

            <div class="mb-4" id="doctorInfoGroup">

                <label class="form-label">Doctor</label>

                <div class="info-box">
                    <div id="doctorDisplay" class="info-value loading-text">Loading...</div>
                </div>

            </div>

            <div class="mb-4" id="doctorSelectGroup" style="display:none;">
                <label for="doctorSelect" class="form-label">Doctor <span class="text-danger">*</span></label>
                <select id="doctorSelect" class="form-select" required></select>
            </div>


            <!-- =====================================================
                 APPOINTMENT DATE
                 ===================================================== -->

            <div class="mb-4">

                <label for="appointmentDate"
                       class="form-label">

                    Appointment Date
                    <span class="text-danger">*</span>

                </label>

                <input type="date"
                       id="appointmentDate"
                       class="form-control"
                       required>

            </div>


            <!-- =====================================================
                 APPOINTMENT TIME
                 ===================================================== -->

            <div class="mb-4">

                <label for="appointmentTime"
                       class="form-label">

                    Appointment Time
                    <span class="text-danger">*</span>

                </label>

                <input type="time"
                       id="appointmentTime"
                       class="form-control"
                       required>

            </div>


 <!-- =====================================================
     STATUS
     ===================================================== -->

<div class="mb-4">

    <label for="status"
           class="form-label">

        Status

    </label>

    <select id="status"
            class="form-select">

        <option value="Scheduled">
            Scheduled
        </option>

        <option value="Confirmed">
            Confirmed
        </option>

        <option value="Completed">
            Completed
        </option>

        <option value="Cancelled">
            Cancelled
        </option>

    </select>

    <div class="form-text">
        Update the appointment status if required.
    </div>

</div>
            <!-- =====================================================
                 BUTTONS
                 ===================================================== -->

            <div class="button-row">

                <button type="submit"
                        id="submitButton"
                        class="btn-update">

                    <i class="fa-solid fa-check"></i>

                    Update Appointment

                </button>


                <button type="button"
                        class="btn-cancel"
                        onclick="cancelEdit()">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =============================================================
     API.JS
     ============================================================= -->

<script th:src="@{/js/api.js}"></script>


<script>

    let appointmentId = null;
    let currentRole = "";

    document.addEventListener("DOMContentLoaded", async function () {
        const params = new URLSearchParams(window.location.search);
        appointmentId = params.get("id");
        currentRole = normalizeRole(getCurrentRole());

        document.getElementById("appointmentForm").addEventListener("submit", submitAppointment);

        if (appointmentId) {
            configureEditMode();
            await loadAppointment();
        } else {
            configureCreateMode();
            await loadCreateOptions();
        }
    });

    function normalizeRole(role) {
        return String(role || "").replace("ROLE_", "").toUpperCase();
    }

    function showError(message) {
        const el = document.getElementById("errorMessage");
        el.textContent = message || "Something went wrong.";
        el.style.display = "block";
    }

    function showSuccess(message) {
        const el = document.getElementById("successMessage");
        el.textContent = message || "Saved successfully.";
        el.style.display = "block";
    }

    function hideMessages() {
        document.getElementById("errorMessage").style.display = "none";
        document.getElementById("successMessage").style.display = "none";
    }

    function configureEditMode() {
        document.getElementById("formTitle").textContent = "Edit Appointment";
        document.getElementById("submitButton").innerHTML = '<i class="fa-solid fa-check"></i> Update Appointment';
        document.getElementById("patientInfoGroup").style.display = "block";
        document.getElementById("doctorInfoGroup").style.display = "block";
        document.getElementById("patientSelectGroup").style.display = "none";
        document.getElementById("doctorSelectGroup").style.display = "none";
        document.getElementById("patientSelect").required = false;
        document.getElementById("doctorSelect").required = false;
    }

    function configureCreateMode() {
        document.getElementById("formTitle").textContent = currentRole === "PATIENT" ? "Book Appointment" : "New Appointment";
        document.getElementById("submitButton").innerHTML = '<i class="fa-solid fa-check"></i> Create Appointment';

        if (currentRole === "ADMIN") {
            document.getElementById("patientInfoGroup").style.display = "none";
            document.getElementById("patientSelectGroup").style.display = "block";
        } else {
            document.getElementById("patientInfoGroup").style.display = "block";
            document.getElementById("patientSelectGroup").style.display = "none";
            document.getElementById("patientSelect").required = false;
        }

        document.getElementById("doctorInfoGroup").style.display = "none";
        document.getElementById("doctorSelectGroup").style.display = "block";
        document.getElementById("status").value = "Scheduled";
        document.getElementById("status").closest(".mb-4").style.display = "none";
    }

    async function loadCreateOptions() {
        hideMessages();
        if (currentRole !== "ADMIN" && currentRole !== "PATIENT") {
            showError("Only Admin or Patient accounts can create appointments.");
            document.getElementById("submitButton").disabled = true;
            return;
        }

        try {
            const doctors = await apiGet("/doctors");
            const doctorList = Array.isArray(doctors) ? doctors : [];
            const doctorSelect = document.getElementById("doctorSelect");
            doctorSelect.innerHTML = '<option value="">Select doctor</option>' + doctorList.map(d =>
                `<option value="${Number(d.id)}">${escapeHtml(d.name || "Unknown Doctor")} — ${escapeHtml(d.specialization || "General")}</option>`
            ).join("");

            if (currentRole === "ADMIN") {
                const patients = await apiGet("/patients");
                const patientList = Array.isArray(patients) ? patients : [];
                const patientSelect = document.getElementById("patientSelect");
                patientSelect.innerHTML = '<option value="">Select patient</option>' + patientList.map(pt =>
                    `<option value="${Number(pt.id)}">${escapeHtml(pt.name || "Unknown Patient")} (ID: ${Number(pt.id)})</option>`
                ).join("");
            } else {
                const patient = await apiGet("/patients/me");
                if (!patient || !patient.id) throw new Error("Your account is not linked to a patient profile.");
                document.getElementById("patientDisplay").textContent = patient.name || "Current Patient";
            }
        } catch (error) {
            console.error("Create appointment setup error:", error);
            showError(error.message || "Unable to prepare appointment form.");
            document.getElementById("submitButton").disabled = true;
        }
    }

    async function loadAppointment() {
        hideMessages();
        try {
            const appointment = await apiGet("/appointments/" + encodeURIComponent(appointmentId));
            if (!appointment) throw new Error("Appointment not found.");

            document.getElementById("patientDisplay").textContent = appointment.patient?.name || "--";
            document.getElementById("doctorDisplay").textContent = appointment.doctor?.name || "--";

            const date = new Date(appointment.appointmentTime);
            if (Number.isNaN(date.getTime())) throw new Error("Appointment date/time is invalid.");

            document.getElementById("appointmentDate").value = date.toISOString().slice(0, 10);
            document.getElementById("appointmentTime").value = date.toTimeString().slice(0, 5);
            document.getElementById("status").value =
                appointment.status || "Scheduled";

            configureStatusOptions();
        } catch (error) {
            console.error("Load appointment error:", error);
            showError(error.message || "Unable to load appointment.");
        }
    }

    async function submitAppointment(event) {
        event.preventDefault();
        hideMessages();

        const date = document.getElementById("appointmentDate").value;
        const time = document.getElementById("appointmentTime").value;
        const submitButton = document.getElementById("submitButton");

        if (!date || !time) {
            showError("Appointment date and time are required.");
            return;
        }

        submitButton.disabled = true;
        submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

        try {
            if (appointmentId) {
                const payload = {
                    id: Number(appointmentId),
                    appointmentTime: date + "T" + time,
                    status: document.getElementById("status").value
                };
                await apiPut("/appointments/" + encodeURIComponent(appointmentId), payload);
                showSuccess("Appointment updated successfully.");
            } else {
                const doctorId = Number(document.getElementById("doctorSelect").value);
                if (!doctorId) throw new Error("Please select a doctor.");

                let patientId;
                if (currentRole === "ADMIN") {
                    patientId = Number(document.getElementById("patientSelect").value);
                    if (!patientId) throw new Error("Please select a patient.");
                } else {
                    const patient = await apiGet("/patients/me");
                    patientId = Number(patient?.id);
                    if (!patientId) throw new Error("Your account is not linked to a patient profile.");
                }

                const payload = {
                    patient: { id: patientId },
                    doctor: { id: doctorId },
                    appointmentTime: date + "T" + time,
                    status: "Scheduled"
                };
                await apiPost("/appointments", payload);
                showSuccess("Appointment created successfully.");
            }

            setTimeout(() => window.location.href = "/ui/appointments", 700);
        } catch (error) {
            console.error("Save appointment error:", error);
            showError(error.message || "Unable to save appointment.");
            submitButton.disabled = false;
            submitButton.innerHTML = appointmentId
                ? '<i class="fa-solid fa-check"></i> Update Appointment'
                : '<i class="fa-solid fa-check"></i> Create Appointment';
        }
    }

    function cancelEdit() {
        window.location.href = "/ui/appointments";
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
    
    function configureStatusOptions() {

        const statusSelect =
            document.getElementById("status");

        if (!statusSelect) {
            return;
        }

        const currentStatus =
            statusSelect.value || "Scheduled";

        statusSelect.innerHTML = "";

        let statuses = [];

        if (currentRole === "DOCTOR") {

            if (currentStatus === "Scheduled") {

                statuses = [
                    "Scheduled",
                    "Confirmed",
                    "Cancelled"
                ];

            } else if (currentStatus === "Confirmed") {

                statuses = [
                    "Confirmed",
                    "Completed",
                    "Cancelled"
                ];

            } else if (
                currentStatus === "Completed" ||
                currentStatus === "Cancelled"
            ) {

                statuses = [
                    currentStatus
                ];

            } else {

                statuses = [
                    "Scheduled"
                ];
            }

        } else {

            statuses = [
                "Scheduled",
                "Confirmed",
                "Completed",
                "Cancelled"
            ];
        }


        statuses.forEach(status => {

            const option =
                document.createElement("option");

            option.value = status;

            option.textContent = status;

            statusSelect.appendChild(
                option
            );

        });


        statusSelect.value =
            currentStatus;
    }
</script>

</body>
</html>
