<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Hospital Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f8fb;
            font-family: Arial, sans-serif;
            color: #182b3a;
            padding: 20px;
        }

        .forgot-card {
            width: min(440px, 100%);
            background: #ffffff;
            border: 1px solid #dce6ed;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 50, 70, .10);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f6fae;
            color: #ffffff;
            font-size: 25px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .subtitle {
            margin: 0;
            color: #667b8c;
            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid #cbd5df;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0f6fae;
            box-shadow: 0 0 0 3px rgba(15, 111, 174, .10);
        }

        .primary {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 8px;
            background: #0f6fae;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        .primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e5f6ef;
            color: #166534;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #0f6fae;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="forgot-card">

    <div class="brand">

        <div class="brand-icon">
            ?
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p class="subtitle">
            Enter the email address associated with your account.
            We will send you a password reset link.
        </p>

    </div>


    <form id="forgotForm">

        <div class="field">

            <label for="email">
                Registered Email
            </label>

            <input
                type="email"
                id="email"
                autocomplete="email"
                placeholder="Enter your registered email"
                required>

        </div>


        <button
            type="submit"
            class="primary"
            id="sendButton">

            Send Reset Link

        </button>

    </form>


    <div id="message"
         class="message">
    </div>


    <a href="/login"
       class="back-link">
        Back to Login
    </a>

</div>


<script>

    const form =
        document.getElementById(
            "forgotForm"
        );

    const emailInput =
        document.getElementById(
            "email"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className =
            "message show " + type;
    }


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Please enter your registered email.",
                    "error"
                );

                return;
            }


            sendButton.disabled = true;

            sendButton.textContent =
                "Sending...";


            try {

                const response =
                    await fetch(
                        "/auth/forgot-password",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                email: email
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to process the request."
                    );
                }


                showMessage(
                    data.message ||
                    "If an account exists for that email, a password reset link has been sent.",
                    "success"
                );


                emailInput.value = "";


            } catch (error) {

                showMessage(
                    error.message ||
                    "Unable to process the request.",
                    "error"
                );

            } finally {

                sendButton.disabled = false;

                sendButton.textContent =
                    "Send Reset Link";
            }
        }
    );

</script>

</body>
</html>
