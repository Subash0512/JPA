<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Hospital Management System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>body{margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#102a43}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}.card{width:100%;max-width:760px;border:0;border-radius:16px;padding:35px;box-shadow:0 8px 30px rgba(15,23,42,.08)}.title{font-size:32px;font-weight:700;margin-bottom:6px}.subtitle{color:#627d98;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{padding:16px;border:1px solid #d6dee8;border-radius:10px;background:#f8fafc}.label{display:block;font-size:13px;color:#627d98;margin-bottom:5px}.value{font-size:17px;font-weight:600;word-break:break-word}.actions{margin-top:25px;display:flex;gap:10px}.message{display:none}.avatar{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1677ff;color:#fff;font-size:28px;font-weight:700;margin-bottom:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}.page{padding:16px}.card{padding:24px}} </style>
</head>
<body>
<div class="page"><div class="card">
<div class="avatar" id="avatar">P</div>
<div class="title">My Profile</div><div class="subtitle">Your registered patient information</div>
<div id="error" class="alert alert-danger message"></div>
<div class="grid">
<div class="field"><span class="label">Name</span><span class="value" id="name">Loading...</span></div>
<div class="field"><span class="label">Age</span><span class="value" id="age">--</span></div>
<div class="field"><span class="label">Gender</span><span class="value" id="gender">--</span></div>
<div class="field"><span class="label">Phone</span><span class="value" id="phone">--</span></div>
<div class="field"><span class="label">Email</span><span class="value" id="email">--</span></div>
<div class="field" style="grid-column:1/-1"><span class="label">Address</span><span class="value" id="address">--</span></div>
</div>
<div class="actions"><button type="button" id="profileEditFallback" class="btn btn-primary">Edit Profile</button><a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a><a href="/ui/appointments" class="btn btn-primary">My Appointments</a></div>
</div></div>
<script th:src="@{/js/api.js}"></script>
<script>document.addEventListener("DOMContentLoaded",async()=>{try{const role=normalizeRole(getCurrentRole());if(role!=="PATIENT"){window.location.href="/dashboard";return}const p=await apiGet("/patients/me");document.getElementById("name").textContent=p.name||"--";document.getElementById("age").textContent=p.age??"--";document.getElementById("gender").textContent=p.gender||"--";document.getElementById("phone").textContent=p.phone||"--";document.getElementById("email").textContent=p.email||"--";document.getElementById("address").textContent=p.address||"--";document.getElementById("avatar").textContent=(p.name||"P").charAt(0).toUpperCase()}catch(e){const el=document.getElementById("error");el.textContent=e.message||"Unable to load profile.";el.style.display="block"}});function normalizeRole(r){return String(r||"").replace("ROLE_","").toUpperCase()}document.getElementById("profileEditFallback")?.addEventListener("click", async()=>{ await togglePatientProfilePanel(); });
</script>
</body></html>
