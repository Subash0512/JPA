<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Hospital Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f8fb;
            font-family: Arial, sans-serif;
            color: #182b3a;
            padding: 20px;
        }

        .reset-card {
            width: min(440px, 100%);
            background: #ffffff;
            border: 1px solid #dce6ed;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 50, 70, .10);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f6fae;
            color: #ffffff;
            font-size: 25px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .subtitle {
            margin: 0;
            color: #667b8c;
            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid #cbd5df;
            border-radius: 8px;
            padding: 0 78px 0 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0f6fae;
            box-shadow: 0 0 0 3px rgba(15, 111, 174, .10);
        }

        .toggle {
            position: absolute;
            right: 8px;
            top: 7px;
            height: 30px;
            padding: 0 10px;
            border: 0;
            border-radius: 6px;
            background: #eef4f8;
            color: #0f6fae;
            font-size: 12px;
            cursor: pointer;
        }

        .primary {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 8px;
            background: #0f6fae;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }

        .primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e5f6ef;
            color: #166534;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #0f6fae;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .invalid-link {
            text-align: center;
            padding: 10px 0;
            color: #991b1b;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="reset-card">

    <div class="brand">

        <div class="brand-icon">
            +
        </div>

        <h1>
            Create a New Password
        </h1>

        <p class="subtitle">
            Enter and confirm your new password below.
        </p>

    </div>


    <div id="invalidLink"
         class="invalid-link"
         style="display:none;">

        This password reset link is missing or invalid.

    </div>


    <form id="resetForm">

        <div class="field">

            <label for="newPassword">
                New Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('newPassword', this)">
                    Show
                </button>

            </div>

        </div>


        <div class="field">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('confirmPassword', this)">
                    Show
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="primary"
            id="resetButton">

            Reset Password

        </button>

    </form>


    <div id="message"
         class="message">
    </div>


    <a href="/login"
       class="back-link">
        Back to Login
    </a>

</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );

    const token =
        params.get("token");

    const form =
        document.getElementById(
            "resetForm"
        );

    const button =
        document.getElementById(
            "resetButton"
        );

    const message =
        document.getElementById(
            "message"
        );

    const invalidLink =
        document.getElementById(
            "invalidLink"
        );


    if (!token) {

        form.style.display = "none";

        invalidLink.style.display =
            "block";
    }


    function togglePassword(id, button) {

        const input =
            document.getElementById(id);

        if (input.type === "password") {

            input.type = "text";
            button.textContent = "Hide";

        } else {

            input.type = "password";
            button.textContent = "Show";
        }
    }


    function showMessage(
        text,
        type
    ) {

        message.textContent = text;
        message.className =
            "message show " + type;
    }


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const newPassword =
                document
                    .getElementById("newPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (newPassword.length < 6) {

                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;
            }


            if (newPassword !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "Resetting...";


            try {

                const response =
                    await fetch(
                        "/auth/reset-password",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                token: token,
                                newPassword:
                                    newPassword,
                                confirmPassword:
                                    confirmPassword
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to reset password."
                    );
                }


                showMessage(
                    "Password reset successfully. Redirecting to login...",
                    "success"
                );

                form.reset();


                setTimeout(
                    function () {

                        window.location.href =
                            "/login";
                    },
                    1800
                );


            } catch (error) {

                showMessage(
                    error.message ||
                    "Unable to reset password.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Reset Password";
            }
        }
    );

</script>

</body>
</html>
